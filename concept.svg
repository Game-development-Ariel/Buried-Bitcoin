    <rect x="12" y="34" width="100" height="54" rx="6" fill="#3c6e8f"/><text x="20" y="66" fill="#fff" font-size="12">CLUES</text>
    <rect x="130" y="34" width="100" height="54" rx="6" fill="#4f7a3a"/><text x="138" y="66" fill="#fff" font-size="12">VALUABLES</text>
    <rect x="248" y="34" width="100" height="54" rx="6" fill="#6a3a3a"/><text x="256" y="66" fill="#fff" font-size="12">JUNK</text>
